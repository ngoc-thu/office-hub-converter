server {
    listen 3000;
    server_name _;

    client_max_body_size 150m;

    location = / {
        default_type text/plain;
        return 200 "office-hub-converter is running\n";
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        add_header Access-Control-Allow-Origin * always;
    }

    location = /excel-to-pdf {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001/forms/libreoffice/convert;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Type" always;
    }

    location = /forms/libreoffice/convert {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001/forms/libreoffice/convert;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Type" always;
    }

    location / {
        return 404;
    }
}
