server {
    listen 10000;
    server_name _;

    client_max_body_size 6m;

    location = / {
        default_type text/plain;
        return 200 "office-hub-converter is running\n";
    }

    location = /health {
        proxy_pass https://demo.gotenberg.dev/health;
        proxy_ssl_server_name on;
        proxy_set_header Host demo.gotenberg.dev;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin * always;
    }

    location = /excel-to-pdf {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass https://demo.gotenberg.dev/forms/libreoffice/convert;
        proxy_ssl_server_name on;
        proxy_set_header Host demo.gotenberg.dev;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Type" always;
    }

    location = /forms/libreoffice/convert {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass https://demo.gotenberg.dev/forms/libreoffice/convert;
        proxy_ssl_server_name on;
        proxy_set_header Host demo.gotenberg.dev;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Type" always;
    }

    location / {
        return 404;
    }
}
